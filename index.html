<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANTE PARA RESPONSIVE EN CELULARES -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Sistema profesional de gestión y control de turnos - Patric Soft">
  <meta name="author" content="Patric Soft">

  <title>Gestión de Turnos | Patric Soft</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Marca Registrada -->
  <div class="brand-badge">
    ® Patric Soft
  </div>

  <!-- Aplicación -->
  <div class="app-container">

    <!-- Header -->
    <header>

      <div>
        <h1>Gestión de Turnos</h1>
        <p class="subtitle">
          Sistema profesional de control de citas y clientes
        </p>
      </div>

      <!-- Estadísticas -->
      <div class="stats-container">

        <div class="stat-card">
          <span>Total</span>
          <strong id="stat-total">0</strong>
        </div>

        <div class="stat-card">
          <span>Confirmados</span>
          <strong id="stat-confirmed">0</strong>
        </div>

        <div class="stat-card">
          <span>Pendientes</span>
          <strong id="stat-pending">0</strong>
        </div>

      </div>

    </header>


    <!-- Contenido principal -->
    <div class="main-content">

      <!-- Panel de Reserva -->
      <div class="panel">

        <h2>Agendar Nuevo Turno</h2>

        <form id="appointment-form">

          <div class="form-group">
            <label for="client-name">Nombre Completo</label>

            <input
              type="text"
              id="client-name"
              class="form-control"
              placeholder="Ej: Carlos Pérez"
              required
            >
          </div>


          <div class="form-group">
            <label for="client-phone">Teléfono / WhatsApp</label>

            <input
              type="tel"
              id="client-phone"
              class="form-control"
              placeholder="Ej: +5491112345678"
              required
            >
          </div>


          <div class="form-group">
            <label for="service-type">Servicio</label>

            <select
              id="service-type"
              class="form-control"
              required
            >
              <option value="" disabled selected>
                Seleccione un servicio
              </option>

              <option value="Consulta General">
                Consulta General ($50 - 30 min)
              </option>

              <option value="Soporte Técnico">
                Soporte Técnico ($80 - 60 min)
              </option>

              <option value="Asesoría Comercial">
                Asesoría Comercial ($100 - 45 min)
              </option>
            </select>
          </div>


          <div class="form-group">
            <label for="app-date">Fecha</label>

            <input
              type="date"
              id="app-date"
              class="form-control"
              required
            >
          </div>


          <div class="form-group">
            <label for="app-time">Hora</label>

            <input
              type="time"
              id="app-time"
              class="form-control"
              required
            >
          </div>


          <button
            type="submit"
            class="btn-submit"
          >
            Reservar Turno
          </button>

        </form>

      </div>


      <!-- Lista de Turnos -->
      <div class="panel">

        <div class="panel-header">

          <h2>Próximos Turnos</h2>

          <button
            id="btn-export"
            class="btn-export"
            title="Exportar a Excel / CSV"
          >
            📊 Exportar CSV
          </button>

        </div>


        <!-- Filtros y Búsqueda -->
        <div class="filter-bar">

          <input
            type="text"
            id="search-input"
            class="form-control search-input"
            placeholder="🔍 Buscar cliente o servicio..."
          >

          <select
            id="filter-status"
            class="form-control filter-select"
          >
            <option value="todos">
              Todos los estados
            </option>

            <option value="pendiente">
              Pendientes
            </option>

            <option value="confirmado">
              Confirmados
            </option>

            <option value="cancelado">
              Cancelados
            </option>
          </select>

        </div>


        <!-- Turnos generados dinámicamente por JavaScript -->
        <div
          id="appointments-container"
          class="appointments-list"
        >
        </div>

      </div>

    </div>

  </div>


  <!-- Contacto Desarrollador -->
  <div class="developer-contact">
    <a
      href="#"
      aria-label="Contacto Patric Soft"
    >
      Patric Soft
    </a>
  </div>


  <!-- Toast Notifications -->
  <div
    id="toast-container"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
  >
  </div>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
